model: ECDetPose
num_keypoints: 31
constrain_keypoints_to_box: true
keypoint_names: []
keypoint_flip_pairs: []
keypoint_oks_sigmas: [
  0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
  0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
  0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
  0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10
]

ECDetPose:
  backbone: ViTAdapter
  encoder: HybridEncoder
  decoder: ECTransformer

ECTransformer:
  num_keypoints: 31
  constrain_keypoints_to_box: true
  keypoint_head_layers: 3

ECCriterion:
  weight_dict: {
    loss_mal: 1,
    loss_bbox: 5,
    loss_giou: 2,
    loss_fgl: 0.15,
    loss_ddf: 1.5,
    loss_keypoint: 5,
    loss_oks: 2,
    loss_keypoint_visibility: 1
  }
  losses: ['mal', 'boxes', 'local', 'keypoints']
  num_keypoints: 31
  keypoint_oks_sigmas: [
    0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
    0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
    0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10,
    0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10
  ]
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2, keypoint_cost_weight: 0.0, oks_cost_weight: 0.0}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  dataset:
    num_keypoints: 31
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: ResizeWithKeypoints, size: [640, 640]}
        - {type: RandomHorizontalFlipWithKeypoints, p: 0.5, keypoint_flip_pairs: [], allow_without_flip_pairs: false}
        # Keep pose fields aligned when invalid boxes are removed. The generic
        # torchvision sanitizer only knows about boxes and labels.
        - {type: KeypointSanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertKeypoints, normalize: true}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: true}
      policy: default
      mosaic_epoch: 0
      mosaic_prob: 0.0
      stop_epoch: 0
      remove_ops: []
  collate_fn:
    mixup_prob: 0.0
    mixup_epoch: 0

val_dataloader:
  dataset:
    num_keypoints: 31
    transforms:
      ops:
        - {type: ResizeWithKeypoints, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertKeypoints, normalize: true}
      policy: default
