# Medium-model counterpart of the S vehicle recipe. Dataset paths and all
# 31-keypoint metadata are inherited from the vehicle example.
__include__: [
  'ecdetpose_s_vehicle_31kpts.yml',
]

output_dir: outputs/ecdetpose_m_vehicle_31kpts

ViTAdapter:
  name: ecvittplus
  embed_dim: 256
  num_heads: 4
  interaction_indexes: [10, 11]
  weights_path: ecvits/ecvittplus.pth

HybridEncoder:
  in_channels: [256, 256, 256]
  depth_mult: 0.67
  expansion: 0.75
  hidden_dim: 256
  dim_feedforward: 512
  act: silu

ECTransformer:
  activation: silu
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  num_layers: 4
  eval_idx: -1
  num_keypoints: 31
  constrain_keypoints_to_box: true

optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$', lr: 0.000025}
    - {params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$', lr: 0.000025, weight_decay: 0.0}
    - {params: '^(?!.*\\.backbone)(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 62
warmup_iter: 2000
lr_gamma: 0.5
