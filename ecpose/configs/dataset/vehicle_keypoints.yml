task: pose

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', 'keypoints']
  keypoint_sigmas: [0.1, 0.1, 0.1, 0.1]

# Update these for your vehicle taxonomy. Use 1 for a single generic "vehicle" class.
num_classes: 1
remap_mscoco_category: False

# Number of annotated vehicle keypoints per instance. Keep this in sync with
# DETRTransformer.num_body_points, DETRPoseCriterion.num_body_points, and
# DETRPosePostProcessor.num_body_points in the model config.
num_keypoints: 4

train_dataloader: 
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /path/to/vehicle/train/images
    ann_file: /path/to/vehicle/train/annotations.json
    return_masks: False
    num_keypoints: 4
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  total_batch_size: 16
  drop_last: True
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /path/to/vehicle/val/images
    ann_file: /path/to/vehicle/val/annotations.json
    return_masks: False
    num_keypoints: 4
    transforms:
      type: Compose
      ops: ~ 
  shuffle: False
  num_workers: 4
  total_batch_size: 32
  drop_last: False
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction
